name: CI

on:
  push:
    branches: [main, dev, prod]
  pull_request:
    branches: [main, dev, prod]
  workflow_dispatch:

# A second push to the same branch cancels the first still-running build.
# Safe to always cancel now: this file only runs quality/test checks --
# migrations and deploys moved to their own dedicated, manually-gated
# workflows (migrate-staging.yml, migrate-production.yml,
# deploy-production.yml) that never race a superseding push the way an
# in-flight `prisma migrate deploy` would.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'

jobs:
  quality:
    name: Typecheck, format & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # postinstall runs `prisma generate`, which needs no DATABASE_URL
      # (see the comment in prisma.config.ts).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # A real gate: the whole tree was formatted in one commit, so any
      # failure here is genuinely the PR's own. Run `pnpm format` to fix.
      - name: Check formatting
        run: pnpm format:check

      # lib/auth/jwt.ts, lib/db.ts and lib/workers/auth.ts all throw at module
      # load if their secret is unset while NODE_ENV=production -- and `next
      # build` sets NODE_ENV=production. So the build genuinely needs these
      # present. They are throwaway values here; the point is only to prove
      # the build compiles, never to reach a real database.
      - name: Build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/placeholder?schema=public
          JWT_SECRET: ci_build_placeholder_secret_not_used_to_sign_anything_real
          CRON_SECRET: ci_build_placeholder_cron_secret
        run: pnpm build

  test:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tests/setup/globalSetup.ts reads .env.test off disk with dotenv and
      # refuses to run without it -- it drops and recreates this database on
      # every run, so it is deliberately a separate one from any dev DB.
      - name: Write .env.test
        run: |
          cat > .env.test <<'ENVFILE'
          DATABASE_URL="postgresql://postgres:postgres@localhost:5432/proplity_test_db?schema=public"
          JWT_SECRET="test_only_jwt_secret_do_not_use_in_production"
          CRON_SECRET="test_only_cron_secret_do_not_use_in_production"
          NODE_ENV="test"
          PAYSTACK_SECRET_KEY="test_only_paystack_secret_do_not_use_in_production"
          NEXT_PUBLIC_SUBSCRIPTIONS_ENABLED="true"
          ENVFILE

      # globalSetup spawns a real `next dev` on port 3101 and the suite makes
      # real HTTP calls against it, so this is slower than a unit-test run.
      - name: Run tests
        run: pnpm test
        env:
          TEST_SETUP_LOGS: '1'

  # Real-browser UI tests (tests/e2e). Kept as its own job so a UI failure is
  # visible without blocking the faster typecheck/integration jobs. Runs
  # against a production build -- `next dev` compiles routes on demand and
  # causes false timeouts under Playwright. A single worker because the specs
  # share one database (e.g. the admin auto-complete toggle vs. the vendor
  # invoice spec).
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: proplity_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/proplity_e2e?schema=public
      JWT_SECRET: e2e_only_jwt_secret_do_not_use_in_production
      CRON_SECRET: e2e_only_cron_secret_do_not_use_in_production
      E2E_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Migrate and seed the database
        run: |
          pnpm run db:migrate:deploy
          pnpm run db:seed2

      - name: Build
        run: pnpm build

      - name: Start the app
        run: |
          nohup pnpm start > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/login > /dev/null && exit 0
            sleep 2
          done
          echo "App did not start in time" && cat app.log && exit 1

      - name: Run Playwright tests
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            app.log
          retention-days: 7

  # Migrations and Vercel deploys used to live here, gated to main. Now that
  # main is the staging tier (see migrate-staging.yml) and prod is the real
  # production gate, both moved to their own dedicated, manually-triggered
  # workflows: migrate-production.yml and deploy-production.yml. Production
  # must not be touched by an ordinary push -- that's the whole point of
  # this split.
